# lychee link-checker config
# Pre-emptive excludes for sites known to block automated checks.
exclude = [
  "https://www.producthunt.com",
  "https://marktechpost.com",
  "https://www.npmjs.com",
  "https://npmjs.com",
  "https://replit.com",  # bot-blocking (RemoteDisconnected on plain GET)
  "https://platform.openai.com",  # 403 to automated checks; live for humans
  "https://fly.io",  # bot-hostile to automated checks
  "https://artificialanalysis.ai",  # heavy bot protection on some endpoints
  "https://blog.enfabrica.net",  # 403 to automated checks (bot protection); live for humans
  "https://www.eetimes.com",  # flaky HTTP/2 protocol errors with automated checks; live for humans
  "https://www.globenewswire.com",  # flaky HTTP/2 protocol errors with automated checks; live for humans
]
# Be lenient with rate-limited hosts; retry before failing.
max_retries = 3
timeout = 30
