name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  links:
    name: Link check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Diagnostic lychee run (TEMPORARY)
        run: |
          curl -sfL -o /tmp/lychee.tgz https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          mkdir -p /tmp/lychee-bin && tar xzf /tmp/lychee.tgz -C /tmp/lychee-bin
          /tmp/lychee-bin/lychee-x86_64-unknown-linux-gnu/lychee --config .lychee.toml --no-progress --format json --output /tmp/lychee-report.json './**/*.md' || echo "lychee exit: $?"
          ls -la /tmp/lychee-report.json || echo "NO REPORT PRODUCED"
      - name: Send report back via API (TEMPORARY)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/lychee-report.json ]; then
            python3 - <<'PYEOF'
          import base64, json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          content = base64.b64encode(open("/tmp/lychee-report.json","rb").read()).decode()
          sha = None
          try:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/contents/lychee-report.json?ref=main",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req) as r:
                  sha = json.load(r)["sha"]
          except Exception as e:
              print("no existing report:", e)
          payload = {"message": "ci: temporary lychee diagnostic report",
                     "content": content, "branch": "main"}
          if sha:
              payload["sha"] = sha
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/contents/lychee-report.json",
              data=json.dumps(payload).encode(), method="PUT",
              headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(req) as r:
              print("uploaded:", r.status)
          PYEOF
          else
            echo "no report file produced"
          fi

  data:
    name: Validate data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate fast-llms.json
        run: |
          python3 - <<'EOF'
          import json

          required = {"name", "vendor", "url", "description",
                      "speed_claim", "speed_verified", "speed_url",
                      "measured_date", "claim_type",
                      "status", "category", "features"}
          statuses = {"active", "maintenance", "archived", "commercial"}
          categories = {"model", "provider", "engine", "technique",
                        "benchmark", "hardware"}
          claim_types = {"vendor-reported", "independent"}

          data = json.load(open("data/fast-llms.json"))
          assert isinstance(data, list) and data, "data/fast-llms.json must be a non-empty list"
          for i, e in enumerate(data):
              missing = required - e.keys()
              assert not missing, f"entry {i} ({e.get('name')}) missing {missing}"
              assert e["category"] in categories, f"entry {i} bad category {e['category']}"
              assert e["status"] in statuses, f"entry {i} bad status {e['status']}"
              assert e["claim_type"] in claim_types, f"entry {i} bad claim_type {e['claim_type']}"
              assert isinstance(e["speed_verified"], bool), f"entry {i} speed_verified not bool"
              assert e["url"].startswith("https://"), f"entry {i} url must be https"
              if e["speed_verified"]:
                  assert e["speed_url"].startswith("https://"), \
                      f"entry {i} ({e.get('name')}) verified speed needs https speed_url"
                  assert e["measured_date"] not in ("", "unknown"), \
                      f"entry {i} ({e.get('name')}) verified speed needs a measured_date"
              assert isinstance(e["features"], list) and e["features"], \
                  f"entry {i} features must be non-empty list"
          names = [e["name"] for e in data]
          assert len(names) == len(set(names)), "duplicate names in data/fast-llms.json"
          print(f"OK: data/fast-llms.json: {len(data)} entries validated")
          EOF
